name: Notify Pages Rebuild

on:
  push:
    branches: ["*"]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pages rebuild
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          curl -s -X POST             -H "Authorization: token $GH_TOKEN"             -H "Accept: application/vnd.github.v3+json"             "https://api.github.com/repos/23776301/23776301.github.io/dispatches"             -d '{"event_type":"repo-updated"}'
          echo "Dispatch sent"
